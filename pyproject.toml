[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scoreproof"
version = "0.0.1"
description = "Convert any score. Prove nothing got lost. A verified music-format converter for AI tools (MCP), the command line and the web."
readme = "README.md"
authors = [{ name = "Anand Sampat", email = "anands@cs.stanford.edu" }]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["music", "musicxml", "midi", "abc", "mei", "humdrum", "mcp", "converter"]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]

[project.urls]
Homepage = "https://github.com/asampat3090/songchain"

[project.scripts]
scoreproof = "scoreproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
