[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scoreproof"
version = "0.1.0"
description = "Convert any score. Prove nothing got lost. A verified music-format converter for AI tools (MCP), the command line and the web."
readme = "README.md"
authors = [{ name = "Anand Sampat", email = "anands@cs.stanford.edu" }]
license = { text = "MIT" }
# converter21 requires 3.12.
requires-python = ">=3.12"
keywords = ["music", "musicxml", "midi", "abc", "mei", "humdrum", "mcp", "converter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
dependencies = [
    "music21>=10",
    "converter21>=4",
    "mcp>=2.3",
    "verovio>=6",
    "pretty_midi>=0.2.10",
    # PDF and PNG: Typst lays out Verovio's SVG pages; fontTools (with
    # brotli for WOFF2) unpacks Verovio's music font for Typst.
    "typst>=0.13",
    "fonttools>=4.40",
    "brotli>=1.0",
]

[project.optional-dependencies]
# The web service (scoreproof serve) on Cloud Run.
hosted = ["uvicorn>=0.30", "starlette>=0.40", "google-cloud-storage>=2.10"]
dev = ["pytest", "pytest-cov", "black", "flake8", "pypdf", "httpx", "uvicorn>=0.30"]

[project.urls]
Homepage = "https://github.com/asampat3090/scoreproof"

[project.scripts]
scoreproof = "scoreproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scoreproof = ["drop.html", "privacy.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["scoreproof"]

[tool.coverage.report]
show_missing = true
precision = 0
