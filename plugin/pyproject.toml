[project]
name = "scoreproof-plugin"
version = "0.1.0"
description = "Locked environment for the Scoreproof MCP server in the Claude plugin."
requires-python = ">=3.12,<3.14"
dependencies = ["scoreproof==0.1.0"]

[tool.uv]
package = false
# Only the platforms Claude Code and Claude Desktop run on, which keeps the
# lockfile under the plugin directory's 256 KiB file limit.
environments = [
    "implementation_name == 'cpython' and sys_platform == 'darwin' and platform_machine == 'arm64'",
    "implementation_name == 'cpython' and sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "implementation_name == 'cpython' and sys_platform == 'win32' and platform_machine == 'AMD64'",
    "implementation_name == 'cpython' and sys_platform == 'win32' and platform_machine == 'ARM64'",
    "implementation_name == 'cpython' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "implementation_name == 'cpython' and sys_platform == 'linux' and platform_machine == 'aarch64'",
]
